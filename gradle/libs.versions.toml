[versions]
agp = "8.5.2"
kotlin = "2.0.21"
composeMultiplatform = "1.7.3"
coroutines = "1.9.0"
serialization = "1.7.3"
coil = "3.0.4"
awsSdk = "1.3.100"
okhttp = "4.12.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
desugar = "2.1.3"
media3 = "1.4.1"
vlcj = "4.8.2"

androidCompileSdk = "34"
androidMinSdk = "24"
androidTargetSdk = "34"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

aws-s3 = { module = "aws.sdk.kotlin:s3", version.ref = "awsSdk" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }

android-desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
